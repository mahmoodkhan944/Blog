<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/blog.css">
</head>
<body>

    <div id="navbar-root"></div>

    <div class="banner">
        <div class="banner-bg"></div>
        <div class="banner-fg"></div>
    </div>

    <div class="blog">
        <h1 class="title"></h1>
        <p class="published"></p>
        <div class="article"></div>

        <div class="share-actions">
            <button class="like-btn" id="likeBtn" onclick="toggleLike()">
                <i class="fa-solid fa-heart"></i>
                <span id="likeCount">0</span>
            </button>
            <button class="share-btn" onclick="shareBlog()">
                <i class="fa-solid fa-share-nodes"></i> Share
            </button>
            <a id="waShare" class="wa-btn" target="_blank" rel="noopener">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
        </div>
    </div>

    <section class="comments-section">
        <h3 class="comments-heading">Comments (<span id="commentCount">0</span>)</h3>

        <div id="commentFormWrap"></div>

        <div id="commentsList" class="comments-list">
            <p class="empty-state">Loading comments...</p>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-storage.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/blog.js"></script>

</body>
</html>
