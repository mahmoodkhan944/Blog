<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog : Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

    <div id="navbar-root"></div>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1 id="authTitle">Welcome back</h1>
            <p class="subtitle" id="authSubtitle">Log in to write and manage your blogs.</p>

            <div class="auth-error" id="authError"></div>

            <form id="authForm">
                <div class="field" id="nameField" style="display:none">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="Your name">
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" minlength="6" required>
                </div>
                <button type="submit" class="btn accent" id="authSubmit">Log in</button>
            </form>

            <p class="auth-switch">
                <button type="button" id="authSwitch">Don't have an account? <strong>Sign up</strong></button>
            </p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-storage.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
