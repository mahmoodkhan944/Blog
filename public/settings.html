<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D96C4A">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/icon.svg">
    <title>Blog : Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <a href="#main" class="skip-link">Skip to content</a>
    <div id="navbar-root"></div>

    <div class="auth-wrap" id="main" tabindex="-1">
        <div class="auth-card">
            <h1>Account settings</h1>
            <p class="subtitle">Update how your name appears on new posts and comments.</p>

            <div class="auth-error" id="settingsError"></div>

            <form id="settingsForm">
                <div class="field">
                    <label for="displayName">Display name</label>
                    <input type="text" id="displayName" required minlength="2">
                </div>
                <div class="field">
                    <label for="emailField">Email</label>
                    <input type="email" id="emailField" disabled>
                </div>
                <button type="submit" class="btn accent" id="settingsSubmit">Save changes</button>
            </form>

            <p class="settings-note">
                This only affects <strong>new</strong> posts/comments — anything you've
                already published keeps the name it was posted under.
            </p>
        </div>
    </div>

    <div id="footer-root"></div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top" style="display:none">↑</button>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>

    <script src="/js/firebase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/back-to-top.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/settings.js"></script>

</body>
</html>
