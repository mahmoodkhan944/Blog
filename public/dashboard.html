<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D96C4A">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/icon.svg">
    <title>Blog : Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/home.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

    <a href="#main" class="skip-link">Skip to content</a>
    <div id="navbar-root"></div>

    <div class="dashboard" id="main" tabindex="-1">
        <div class="dashboard-header">
            <div>
                <h1>Your blogs</h1>
                <p>Manage everything you've published.</p>
            </div>
            <div class="dashboard-header-actions">
                <a href="/settings" class="btn small ghost">⚙ Settings</a>
                <a href="/editor" class="btn accent">Write new</a>
            </div>
        </div>

        <section class="dash-section">
            <h2 class="dash-section-title">Overview</h2>
            <div class="stats-panel" id="statsPanel"></div>
        </section>

        <section class="dash-section">
            <div class="dash-section-header">
                <h2 class="dash-section-title">Your posts</h2>
                <button class="btn small ghost" id="checkImagesBtn" onclick="checkBrokenImages()">
                    <span aria-hidden="true">🔍</span> Check images
                </button>
            </div>

            <div id="imageCheckResults"></div>

            <div class="bulk-bar" id="bulkBar" style="display:none">
                <span id="bulkCount"></span>
                <div class="bulk-bar-actions">
                    <button class="btn small ghost" id="bulkClear">Clear selection</button>
                    <button class="btn small danger" id="bulkDelete">Delete selected</button>
                </div>
            </div>

            <div class="blogs-grid">
                <div class="skeleton-card">
                    <div class="skeleton-block skeleton-image"></div>
                    <div class="skeleton-block skeleton-line" style="width:80%"></div>
                    <div class="skeleton-block skeleton-line" style="width:45%"></div>
                    <div class="skeleton-block skeleton-line" style="width:95%"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-block skeleton-image"></div>
                    <div class="skeleton-block skeleton-line" style="width:70%"></div>
                    <div class="skeleton-block skeleton-line" style="width:50%"></div>
                    <div class="skeleton-block skeleton-line" style="width:85%"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-block skeleton-image"></div>
                    <div class="skeleton-block skeleton-line" style="width:60%"></div>
                    <div class="skeleton-block skeleton-line" style="width:40%"></div>
                    <div class="skeleton-block skeleton-line" style="width:90%"></div>
                </div>
            </div>

            <nav class="pagination" id="pagination"></nav>
        </section>
    </div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top" style="display:none">↑</button>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>

    <script src="/js/firebase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/back-to-top.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/blog-cards.js"></script>
    <script src="/js/dashboard.js"></script>

</body>
</html>
