<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D96C4A">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/icon.svg">
    <title>Blog : Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,500;0,500;0,600;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

    <a href="#main" class="skip-link">Skip to content</a>
    <div id="navbar-root"></div>

    <div class="auth-wrap" id="main" tabindex="-1">
        <div class="auth-card" style="text-align:left;">
            <h1 style="text-align:center;">Get in touch</h1>
            <p class="subtitle" style="text-align:center;">Questions, feedback, or a story idea? We'd love to hear it.</p>
            <p style="line-height:1.7; color:var(--ink-soft); text-align:center; margin-top:var(--space-4);">
                Email us at
                <a href="mailto:hello@example.com" style="color:var(--accent-dark); font-weight:600;">hello@example.com</a>
            </p>
        </div>
    </div>

    <div id="footer-root"></div>

    <button class="back-to-top" id="backToTop" aria-label="Back to top" style="display:none">↑</button>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>

    <script src="/js/firebase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/back-to-top.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/footer.js"></script>
    <script>renderNav(null);</script>

</body>
</html>
