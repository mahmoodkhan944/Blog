<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog : Homepage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>

    <div id="navbar-root"></div>

    <header class="header">
        <div class="content">
            <h1 class="heading">
                <span class="small">welcome to the world of</span>
                blog
                <span class="no-fill">writing</span>
            </h1>
            <p class="hero-subtitle">Real stories and ideas, written by people — not algorithms.</p>
            <div class="hero-actions">
                <a href="/editor" class="btn accent">Write a blog</a>
                <a href="#featuredWrap" class="btn ghost-light">Start reading</a>
            </div>
        </div>
    </header>

    <section class="featured-wrap" id="featuredWrap">
        <p class="empty-state">Loading blogs...</p>
    </section>

    <div class="section-heading" id="moreHeading">
        <span class="eyebrow">Browse</span>
        <h2>More stories</h2>
        <p>Fresh writing from our community.</p>
    </div>

    <section class="blogs-section"></section>

    <div class="view-all-wrap" id="viewAllWrap">
        <a href="/blogs" class="btn ghost">View all blogs</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-storage.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/blog-cards.js"></script>
    <script src="js/home.js"></script>

</body>
</html>
