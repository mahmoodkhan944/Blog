<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog : Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/editor.css">
</head>
<body>

    <div id="navbar-root"></div>

    <div class="editor-container">

        <!-- TOP BAR -->
        <div class="editor-header">
            <input type="text" class="title" placeholder="Enter blog title..." />
            <div class="actions">
                <button class="publish-btn btn accent">Publish</button>
                <label class="upload-btn">
                    Upload Image
                    <input type="file" id="image-upload" accept="image/*" hidden>
                </label>
            </div>
        </div>

        <!-- BANNER -->
        <div class="banner" onclick="openBannerUpload()">
            <div class="banner-bg"></div>
            <div class="banner-fg"></div>
            <span>Click to upload banner</span>
            <input type="file" id="banner-upload" accept="image/*" hidden>
        </div>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <button onmousedown="event.preventDefault()" onclick="addHeading()" title="Heading">
                <i class="fa-solid fa-heading"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addBold()" title="Bold">
                <i class="fa-solid fa-bold"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addItalic()" title="Italic">
                <i class="fa-solid fa-italic"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addList()" title="Bullet list">
                <i class="fa-solid fa-list"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="clearFormat()" title="Clear formatting">
                <i class="fa-solid fa-eraser"></i>
            </button>
        </div>

        <!-- EDITOR (WYSIWYG) -->
        <div class="article" contenteditable="true" data-placeholder="Start writing your blog..."></div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-storage.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/api.js"></script>
    <script src="js/editor.js"></script>

</body>
</html>
