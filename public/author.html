<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D96C4A">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/icon.svg">
    <title>Blog : Author</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/home.css">
</head>
<body>

    <a href="#main" class="skip-link">Skip to content</a>
    <div id="navbar-root"></div>

    <div class="section-heading no-hero" id="main" tabindex="-1">
        <span class="eyebrow">Author</span>
        <h2 id="authorName">Loading...</h2>
        <p id="authorCount"></p>
    </div>

    <section class="blogs-section" id="authorPosts">
        <p class="empty-state">Loading posts...</p>
    </section>

    <section class="newsletter-strip">
        <div class="newsletter-content">
            <div>
                <h3>Never miss a story</h3>
                <p>Get an email when something new is published. No spam, unsubscribe anytime.</p>
            </div>
            <form id="newsletterForm" class="newsletter-form">
                <input type="email" id="newsletterEmail" placeholder="you@example.com" required>
                <button type="submit" class="btn dark">Subscribe</button>
            </form>
        </div>
    </section>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-storage.js"></script>

    <script src="/js/firebase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/blog-cards.js"></script>
    <script src="/js/author.js"></script>
    <script>initNewsletterForm();</script>

</body>
</html>
