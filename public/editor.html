<!DOCTYPE html>
<html lang="en">
<head>
    <script>
      (function () {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#D96C4A">
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/img/icon.svg">
    <title>Blog : Editor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:ital,wght@0,400;0,500;0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/editor.css">
</head>
<body>

    <a href="#main" class="skip-link">Skip to content</a>
    <div id="navbar-root"></div>

    <div class="editor-container" id="main" tabindex="-1">

        <!-- TOP BAR -->
        <div class="editor-header">
            <input type="text" class="title" placeholder="Enter blog title..." />
            <div class="actions">
                <select class="category-select" id="categorySelect" title="Category" aria-label="Category"></select>
                <button class="draft-btn btn ghost">Save Draft</button>
                <button class="publish-btn btn accent">Publish</button>
            </div>
        </div>

        <div class="autosave-banner" id="autosaveBanner" style="display:none"></div>

        <!-- BANNER -->
        <div class="banner" onclick="openBannerUpload()">
            <div class="banner-bg"></div>
            <div class="banner-fg"></div>
            <span>Click to upload banner</span>
            <input type="file" id="banner-upload" accept="image/*" hidden>
        </div>

        <!-- TOOLBAR (sticky — stays reachable while scrolling/writing) -->
        <div class="toolbar">
            <button onmousedown="event.preventDefault()" onclick="undoEdit()" title="Undo" aria-label="Undo">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="redoEdit()" title="Redo" aria-label="Redo">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <span class="toolbar-divider"></span>
            <button onmousedown="event.preventDefault()" onclick="addHeading()" title="Heading" aria-label="Heading">
                <i class="fa-solid fa-heading"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addBold()" title="Bold" aria-label="Bold">
                <i class="fa-solid fa-bold"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addItalic()" title="Italic" aria-label="Italic">
                <i class="fa-solid fa-italic"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addList()" title="Bullet list" aria-label="Bullet list">
                <i class="fa-solid fa-list"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addBlockquote()" title="Quote" aria-label="Quote">
                <i class="fa-solid fa-quote-left"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="addLink()" title="Insert link" aria-label="Insert link">
                <i class="fa-solid fa-link"></i>
            </button>
            <button onmousedown="event.preventDefault()" onclick="clearFormat()" title="Clear formatting" aria-label="Clear formatting">
                <i class="fa-solid fa-eraser"></i>
            </button>
            <span class="toolbar-divider"></span>
            <button onmousedown="event.preventDefault()" onclick="triggerImageUpload()" title="Insert image" aria-label="Insert image">
                <i class="fa-solid fa-image"></i>
            </button>
            <input type="file" id="image-upload" accept="image/*" hidden>
            <span class="toolbar-divider"></span>
            <button onmousedown="event.preventDefault()" onclick="toggleDirection()" title="Switch text direction (LTR/RTL)" aria-label="Switch text direction">
                <i class="fa-solid fa-right-left"></i>
            </button>
        </div>

        <!-- EDITOR (WYSIWYG) -->
        <div class="article" contenteditable="true" data-placeholder="Start writing your blog..."></div>

        <p class="autosave-status" id="autosaveStatus"></p>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-auth.js"></script>

    <script src="/js/firebase.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/pwa.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/blog-cards.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/editor.js"></script>

</body>
</html>
